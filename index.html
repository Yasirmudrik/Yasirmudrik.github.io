<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>Dashboard Absensi - MTS Muhammadiyah Sigaluh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; }
    .glass-effect {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-slate-800">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
          <i class="fas fa-mosque"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">SiAbsen</h1>
          <p class="text-xs text-gray-500">MTS Muhammadiyah Sigaluh</p>
        </div>
      </div>
      <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-600">
        <i class="fas fa-user"></i>
      </div>
    </div>
  </header>

  <div class="max-w-4xl mx-auto px-6 pt-8 pb-4 w-full">
    <div class="bg-gradient-to-r from-blue-600 to-blue-800 rounded-2xl p-6 text-white shadow-xl shadow-blue-100 relative overflow-hidden">
      <div class="relative z-10">
        <h2 class="text-2xl font-bold mb-1">Assalamu'alaikum!</h2>
        <p class="text-blue-100 opacity-90">Silakan pilih menu absensi ibadah hari ini.</p>
      </div>
      <div class="absolute top-0 right-0 -mr-4 -mt-4 w-24 h-24 bg-white opacity-10 rounded-full"></div>
      <div class="absolute bottom-0 right-10 -mb-4 w-16 h-16 bg-white opacity-10 rounded-full"></div>
    </div>
  </div>

  <main class="flex-grow w-full max-w-4xl mx-auto px-6 py-6">
    <h3 class="font-bold text-gray-800 mb-4 text-sm uppercase tracking-wider">Menu Utama</h3>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <a href="dhuha.html" class="group bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md hover:-translate-y-1 transition-all duration-300 flex items-center gap-4">
        <div class="w-14 h-14 bg-blue-50 rounded-xl flex items-center justify-center text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-colors">
          <i class="fas fa-sun text-2xl"></i>
        </div>
        <div>
          <h4 class="font-bold text-gray-800">Sholat Dhuha</h4>
          <p class="text-xs text-gray-500 mt-1">Absensi Pagi</p>
        </div>
        <div class="ml-auto text-gray-300 group-hover:text-blue-600 transition-colors">
          <i class="fas fa-chevron-right"></i>
        </div>
      </a>

      <a href="dzuhur.html" class="group bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md hover:-translate-y-1 transition-all duration-300 flex items-center gap-4">
        <div class="w-14 h-14 bg-green-50 rounded-xl flex items-center justify-center text-green-600 group-hover:bg-green-600 group-hover:text-white transition-colors">
          <i class="fas fa-clock text-2xl"></i>
        </div>
        <div>
          <h4 class="font-bold text-gray-800">Sholat Dzuhur</h4>
          <p class="text-xs text-gray-500 mt-1">Absensi Siang</p>
        </div>
        <div class="ml-auto text-gray-300 group-hover:text-green-600 transition-colors">
          <i class="fas fa-chevron-right"></i>
        </div>
      </a>

      <a href="jum'at.html" class="group bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md hover:-translate-y-1 transition-all duration-300 flex items-center gap-4">
        <div class="w-14 h-14 bg-yellow-50 rounded-xl flex items-center justify-center text-yellow-600 group-hover:bg-yellow-500 group-hover:text-white transition-colors">
          <i class="fas fa-users text-2xl"></i>
        </div>
        <div>
          <h4 class="font-bold text-gray-800">Sholat Jum'at</h4>
          <p class="text-xs text-gray-500 mt-1">Khusus Hari Jum'at</p>
        </div>
        <div class="ml-auto text-gray-300 group-hover:text-yellow-500 transition-colors">
          <i class="fas fa-chevron-right"></i>
        </div>
      </a>
    </div>
  </main>

  <footer class="text-center py-6 text-gray-400 text-sm">
    <p>&copy; 2025 MTS Muhammadiyah Sigaluh</p>
  </footer>

</body>
</html>
