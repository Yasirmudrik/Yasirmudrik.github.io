<head>
  <meta charset="UTF-8" />

  <title>Absensi Sholat Dzuhur</title>

<body class="bg-greenest-50 min-h-screen flex flex-col text-greenest-900">
  <header class="bg-greenest-200 text-greenest-900 p-4 shadow-md">
    <h1 class="text-2xl font-semibold text-center">Absensi Sholat MTS Muhammadiyah Sigaluh</h1>
  </header>

  <main class="flex-grow container mx-auto p-4 max-w-7xl">
    <section class="mb-8 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
      <h2 class="text-xl font-semibold mb-4 md:mb-0 text-center md:text-left">Pilih Kelas</h2>
      <div class="flex flex-wrap justify-center gap-4 flex-grow">
        <button data-class="7a" class="class-btn px-4 py-2 rounded bg-greenest-300 text-greenest-900 hover:bg-greenest-400 transition">VIIA</button>
        <button data-class="7b" class="class-btn px-4 py-2 rounded bg-greenest-300 text-greenest-900 hover:bg-greenest-400 transition">VIIB</button>
        <button data-class="8a" class="class-btn px-4 py-2 rounded bg-greenest-300 text-greenest-900 hover:bg-greenest-400 transition">VIIIA</button>
        <button data-class="8b" class="class-btn px-4 py-2 rounded bg-greenest-300 text-greenest-900 hover:bg-greenest-400 transition">VIIIB</button>
        <button data-class="9a" class="class-btn px-4 py-2 rounded bg-greenest-300 text-greenest-900 hover:bg-greenest-400 transition">IXA</button>
        <button data-class="9b" class="class-btn px-4 py-2 rounded bg-greenest-300 text-greenest-900 hover:bg-greenest-400 transition">IXB</button>
      </div>
      <div class="flex gap-2 flex-wrap justify-center md:justify-start">
        <button id="btn-global-rekap" class="px-4 py-2 bg-greenest-400 text-greenest-900 rounded hover:bg-greenest-500 transition flex items-center gap-2 w-full sm:w-auto justify-center">
          <i class="fas fa-chart-bar"></i> Rekap Semua Kelas
        </button>
      </div>
    </section>

    <section id="class-section" class="hidden">
      <div class="flex flex-col md:flex-row md:justify-between md:items-center mb-4 gap-2 md:gap-0">
        <h2 id="class-title" class="text-2xl font-semibold mb-2 md:mb-0"></h2>
        <div class="flex gap-2 flex-wrap items-center">
          <button id="btn-rekap" class="px-4 py-2 bg-greenest-400 text-greenest-900 rounded hover:bg-greenest-500 transition flex items-center gap-2">
            <i class="fas fa-chart-bar"></i> Rekap Absensi
          </button>
          <button id="btn-tambah" class="px-4 py-2 bg-greenest-300 text-greenest-900 rounded hover:bg-greenest-400 transition flex items-center gap-2">
            <i class="fas fa-plus"></i> Tambah Siswa
          </button>
          <button id="btn-hapus-siswa" class="px-4 py-2 bg-redest-700 text-white rounded hover:bg-redest-800 transition flex items-center gap-2">
            <i class="fas fa-user-minus"></i> Hapus Siswa
          </button>
          <span id="absen-status" class="ml-2 text-sm font-semibold text-redest-700 hidden">Absensi hari ini sudah selesai</span>
        </div>
      </div>

      <div id="student-list" class="overflow-x-auto border border-greenest-300 rounded bg-greenest-50 shadow-sm">
        <table class="min-w-full text-left text-greenest-900">
          <thead class="bg-greenest-100">
            <tr>
              <th class="px-4 py-2 border border-greenest-300">No</th>
              <th class="px-4 py-2 border border-greenest-300">Nama Siswa</th>
              <th class="px-4 py-2 border border-greenest-300">Hadir</th>
              <th class="px-4 py-2 border border-greenest-300">Sakit/Menstruasi</th>
              <th class="px-4 py-2 border border-greenest-300">Alpha</th>
              <th class="px-4 py-2 border border-greenest-300">Absensi</th>
            </tr>
          </thead>
          <tbody id="students-tbody"></tbody>
        </table>
      </div>

      <div class="mt-4 flex justify-center">
        <button id="btn-kirim" class="px-6 py-2 bg-greenest-600 text-greenest-50 rounded hover:bg-greenest-700 transition flex items-center gap-2">
          <i class="fas fa-paper-plane"></i> Kirim 
        </button>
      </div>
    </section>

    <section id="rekap-section" class="hidden max-w-5xl mx-auto mt-8">
      <h2 id="rekap-title" class="text-2xl font-semibold mb-4 text-center"></h2>
      <div class="flex flex-col sm:flex-row sm:justify-center sm:items-center sm:gap-4 mb-4 px-2">
        <label for="rekap-year" class="font-medium mb-1 sm:mb-0">Tahun:</label>
        <select id="rekap-year" class="border border-greenest-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-greenest-500">
        </select>
        <label for="rekap-month" class="font-medium mb-1 sm:mb-0">Bulan:</label>
        <select id="rekap-month" class="border border-greenest-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-greenest-500">
          <option value="01">Januari</option>
          <option value="02">Februari</option>
          <option value="03">Maret</option>
          <option value="04">April</option>
          <option value="05">Mei</option>
          <option value="06">Juni</option>
          <option value="07">Juli</option>
          <option value="08">Agustus</option>
          <option value="09">September</option>
          <option value="10">Oktober</option>
          <option value="11">November</option>
          <option value="12">Desember</option>
        </select>
      </div>
      <div id="printable" class="overflow-x-auto border border-greenest-300 rounded bg-greenest-50 shadow-sm">
        <table class="min-w-full text-left text-greenest-900" id="rekap-table">
          <thead class="bg-greenest-100">
            <tr>
              <th class="px-4 py-2 border border-greenest-300">No</th>
              <th class="px-4 py-2 border border-greenest-300">Nama Siswa</th>
              <th class="px-4 py-2 border border-greenest-300">Kelas</th>
              <th class="px-4 py-2 border border-greenest-300">Jumlah Hadir</th>
              <th class="px-4 py-2 border border-greenest-300">Jumlah Sakit</th>
              <th class="px-4 py-2 border border-greenest-300">Jumlah Tidak Hadir</th>
            </tr>
          </thead>
          <tbody id="rekap-tbody"></tbody>
        </table>
      </div>
      <div class="mt-4 flex justify-center gap-4 flex-wrap px-2">
        <button id="btn-back" class="px-4 py-2 bg-greenest-600 text-greenest-50 rounded hover:bg-greenest-700 transition flex items-center gap-2">
          <i class="fas fa-arrow-left"></i> Kembali
        </button>
        <button id="btn-rekap-refresh" class="px-4 py-2 bg-greenest-500 text-greenest-50 rounded hover:bg-greenest-600 transition flex items-center gap-2">
          <i class="fas fa-sync-alt"></i> Refresh Rekap
        </button>
        <button id="btn-print" class="px-4 py-2 bg-green-700 text-white rounded hover:bg-green-800 transition flex items-center gap-2">
          <i class="fas fa-print"></i> Print
        </button>
      </div>
    </section>

    <section id="tambah-section" class="hidden mt-8 max-w-md mx-auto bg-greenest-50 p-6 rounded shadow-sm border border-greenest-300">
      <h2 class="text-2xl font-semibold mb-4 text-center text-greenest-900">Tambah Siswa Baru</h2>
      <form id="form-tambah" class="flex flex-col gap-4">
        <div>
          <label for="nama-siswa" class="block mb-1 font-medium text-greenest-900">Nama Siswa</label>
          <input
            type="text"
            id="nama-siswa"
            name="nama-siswa"
            required
            class="w-full border border-greenest-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-greenest-500 text-greenest-900 bg-greenest-50"
            placeholder="Masukkan nama siswa"
          />
        </div>
        <div>
          <label for="kelas-siswa" class="block mb-1 font-medium text-greenest-900">Kelas</label>
          <select
            id="kelas-siswa"
            name="kelas-siswa"
            required
            class="w-full border border-greenest-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-greenest-500 text-greenest-900 bg-greenest-50"
          >s
            <option value="" disabled selected>Pilih kelas</option>
            <option value="7a">VII A</option>
            <option value="7b">VII B</option>
            <option value="8a">VIII A</option>
            <option value="8b">VIII B</option>
            <option value="9a">IX A</option>
            <option value="9b">IX B</option>
          </select>
        </div>
        <div class="flex justify-center gap-4">
          <button
            type="submit"
            class="px-6 py-2 bg-greenest-300 text-greenest-900 rounded hover:bg-greenest-400 transition flex items-center gap-2"
          >
            <i class="fas fa-plus"></i> Tambah
          </button>
          <button
            type="button"
            id="btn-cancel-tambah"
            class="px-6 py-2 bg-greenest-600 text-greenest-50 rounded hover:bg-greenest-700 transition flex items-center gap-2"
          >
            <i class="fas fa-times"></i> Batal
          </button>
        </div>
      </form>
    </section>

    <section id="hapus-siswa-section" class="hidden mt-8 max-w-md mx-auto bg-greenest-50 p-6 rounded shadow-sm border border-greenest-300">
      <h2 class="text-2xl font-semibold mb-4 text-center text-greenest-900">Hapus Siswa</h2>
      <div class="mb-4">
        <label for="hapus-siswa-select" class="block mb-1 font-medium text-greenest-900">Pilih Siswa yang akan dihapus</label>
        <select id="hapus-siswa-select" class="w-full border border-greenest-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-redest-600 text-greenest-900 bg-greenest-50">
        </select>
      </div>
      <div class="flex justify-center gap-4">
        <button id="btn-confirm-hapus" class="px-6 py-2 bg-redest-700 text-white rounded hover:bg-redest-800 transition flex items-center gap-2">
          <i class="fas fa-trash-alt"></i> Hapus
        </button>
        <button id="btn-cancel-hapus" class="px-6 py-2 bg-greenest-600 text-greenest-50 rounded hover:bg-greenest-700 transition flex items-center gap-2">
          <i class="fas fa-times"></i> Batal
        </button>
      </div>
    </section>
  </main>

  <footer class="bg-greenest-200 text-greenest-900 text-center p-4 mt-auto">
    <p>MTS Muhammadiyah Sigaluh &copy; 2025</p>
  </footer>

<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyA0jSKxE0lrw2FiqTgaF12sP7NbBwl3PT0",
    authDomain: "absensimtsmuh.firebaseapp.com",
    projectId: "absensimtsmuh",
    storageBucket: "absensimtsmuh.firebasestorage.app",
    messagingSenderId: "506972473814",
    appId: "1:506972473814:web:d9547f9c7b52496e24fc77",
    measurementId: "G-NJ5GXERBN1"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);

    // --- LOGIKA APLIKASI & VARIABEL GLOBAL ---

    const classes = ['7a', '7b', '8a', '8b', '9a', '9b'];
    let currentClass = null;
    let studentsData = []; 
    const COLLECTION_NAME = "absensi_dzuhur"; 

    const romanMap = { '7': 'VII', '8': 'VIII', '9': 'IX' };
    function classCodeToRoman(code) {
      if (!code || code.length < 2) return '';
      const num = code.charAt(0);
      const letter = code.charAt(1).toUpperCase();
      return romanMap[num] + letter;
    }

    function getTodayDate() {
      return new Date().toISOString().slice(0, 10);
    }
    
    function getMonthName(month) {
        const months = {
            "01": "Januari", "02": "Februari", "03": "Maret", "04": "April", "05": "Mei", "06": "Juni",
            "07": "Juli", "08": "Agustus", "09": "September", "10": "Oktober", "11": "November", "12": "Desember"
        };
        return months[month] || month;
    }
    
    function getCurrentYearMonth() {
      const now = new Date();
      return {
        year: now.getFullYear().toString(),
        month: (now.getMonth() + 1).toString().padStart(2, '0')
      };
    }

    // --- Mengambil semua DOM Elements ---
    const ui = {
      classSection: document.getElementById('class-section'),
      rekapSection: document.getElementById('rekap-section'),
      tambahSection: document.getElementById('tambah-section'),
      hapusSection: document.getElementById('hapus-siswa-section'),
      tbody: document.getElementById('students-tbody'),
      rekapTbody: document.getElementById('rekap-tbody'),
      classTitle: document.getElementById('class-title'),
      statusMsg: document.getElementById('absen-status'),
      btnKirim: document.getElementById('btn-kirim'),
      btnHapusSiswa: document.getElementById('btn-hapus-siswa'),
      rekapYearSelect: document.getElementById('rekap-year'),
      rekapMonthSelect: document.getElementById('rekap-month'),
      rekapTitle: document.getElementById('rekap-title'),
      hapusSiswaSelect: document.getElementById('hapus-siswa-select'),
      namaSiswaInput: document.getElementById('nama-siswa'),
      kelasSiswaSelect: document.getElementById('kelas-siswa'),
      formTambah: document.getElementById('form-tambah'),
      classButtons: document.querySelectorAll('.class-btn'), 
      btnRekap: document.getElementById('btn-rekap'),
      btnGlobalRekap: document.getElementById('btn-global-rekap'),
      btnTambah: document.getElementById('btn-tambah'),
      btnBack: document.getElementById('btn-back'),
      btnRekapRefresh: document.getElementById('btn-rekap-refresh'),
      btnPrint: document.getElementById('btn-print'),
      btnCancelTambah: document.getElementById('btn-cancel-tambah'),
      btnCancelHapus: document.getElementById('btn-cancel-hapus'),
      btnConfirmHapus: document.getElementById('btn-confirm-hapus')
    };
    
    // --- FUNGSI DATABASE & DATA MANIPULASI ---

    function generateDummyStudents(cls) {
      let arr = [];
      for (let i = 0; i < 25; i++) { 
        arr.push({
          id: crypto.randomUUID(),
          name: `Siswa ${classCodeToRoman(cls)} ${i + 1}`,
          attendance: 0, sick: 0, statusToday: null
        });
      }
      return arr;
    }
    
    // 1. Ambil Data Siswa (Load Class)
    async function loadClassData(className) {
      currentClass = className;
      ui.classTitle.textContent = `Kelas ${classCodeToRoman(className)} (Memuat data...)`;
      ui.tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-greenest-600">Mengambil data dari database...</td></tr>';
      
      const today = getTodayDate();
      const docId = `${className}_${today}`;
      
      try {
        const docSnap = await getDoc(doc(db, COLLECTION_NAME, docId));

        if (docSnap.exists()) {
          studentsData = docSnap.data().students;
          updateUIState(true); 
        } else {
          let storedStudents = JSON.parse(sessionStorage.getItem(`master_students_${className}`));
          
          if (storedStudents && storedStudents.length > 0) {
              studentsData = storedStudents.map(s => ({
                  id: s.id,
                  name: s.name,
                  attendance: 0, 
                  sick: 0,
                  statusToday: null
              }));
          } else {
              studentsData = generateDummyStudents(className);
              sessionStorage.setItem(`master_students_${className}`, JSON.stringify(studentsData.map(s => ({id: s.id, name: s.name}))));
          }
          
          updateUIState(false); 
        }
        
        renderTable();
        ui.classTitle.textContent = `Kelas ${classCodeToRoman(className)}`;
        showSection('class');
      } catch (error) {
        console.error("Error getting document or session data:", error);
        alert("Gagal memuat data kelas: " + error.message);
        studentsData = generateDummyStudents(className); 
        renderTable();
        showSection('class');
      }
    }

    // 2. Simpan Data Absensi (Kirim) - LOGIKA INI SUDAH DIPERBAIKI
    async function saveAttendanceToDB() {
      if (!currentClass) {
        alert("Mohon pilih kelas terlebih dahulu sebelum mengirim absensi.");
        return;
      }
      if (ui.btnKirim.disabled) {
        alert("Absensi hari ini sudah dikirim dan tidak bisa dikirim ulang.");
        return;
      }
      
      // Tambahkan visual feedback saat proses kirim
      const originalText = ui.btnKirim.textContent;
      ui.btnKirim.textContent = 'Mengirim...';
      ui.btnKirim.classList.add('opacity-50', 'cursor-not-allowed');
      ui.btnKirim.disabled = true;

      const today = getTodayDate();
      const { year, month } = getCurrentYearMonth();
      const docId = `${currentClass}_${today}`;
      
      const attendanceSnapshot = studentsData.map(s => ({
          id: s.id,
          name: s.name,
          attendance: s.statusToday === 'absen' ? 1 : 0, 
          sick: s.statusToday === 'sakit' ? 1 : 0,    
          tidakHadir: s.statusToday === null ? 1 : 0,
          statusToday: s.statusToday
      }));

      const dataToSave = {
        date: today,
        class: currentClass,
        year: year,
        month: month,
        students: attendanceSnapshot, 
        timestamp: new Date()
      };

      try {
        await setDoc(doc(db, COLLECTION_NAME, docId), dataToSave);
        sessionStorage.setItem(`master_students_${currentClass}`, JSON.stringify(studentsData.map(s => ({id: s.id, name: s.name}))));
        alert(`Absensi kelas ${classCodeToRoman(currentClass)} berhasil dikirim permanen ke Database!`);
        updateUIState(true); 
      } catch (error) {
        console.error("Error saving document:", error);
        alert("Gagal menyimpan ke Database: " + error.message + ". Cek konsol browser untuk detail.");
        // Kembalikan status tombol jika gagal
        ui.btnKirim.textContent = originalText;
        ui.btnKirim.classList.remove('opacity-50', 'cursor-not-allowed');
        ui.btnKirim.disabled = false;
      }
    }
    
    // 3. Rekap Data (Query dari Database)
    async function loadRekapFromDB(className = null, year, month = null) {
      ui.rekapTbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-greenest-600">Sedang mengambil data rekap...</td></tr>';
      
      let queryConstraints = [where("year", "==", year)];
      
      if (className) {
        queryConstraints.push(where("class", "==", className));
        ui.rekapTitle.textContent = `Rekap Absensi ${month ? 'Bulanan' : 'Tahunan'} Kelas ${classCodeToRoman(className)} - ${month ? getMonthName(month) : ''} ${year}`;
      } else {
        ui.rekapTitle.textContent = `Rekap Absensi Tahunan Semua Kelas - ${year}`;
      }
      
      if (month) {
           queryConstraints.push(where("month", "==", month));
      }

      try {
          const q = query(collection(db, COLLECTION_NAME), ...queryConstraints);
          const querySnapshot = await getDocs(q);
          
          let rekapMap = {}; 
          let hasData = false;

          querySnapshot.forEach((doc) => {
              const data = doc.data();
              hasData = true;

              data.students.forEach(s => {
                  const mapKey = `${data.class}_${s.id}`;
                  
                  if (!rekapMap[mapKey]) {
                      rekapMap[mapKey] = { 
                          id: s.id,
                          name: s.name, 
                          class: data.class,
                          hadir: 0, 
                          sakit: 0, 
                          alpha: 0 
                      };
                  }
                  rekapMap[mapKey].hadir += s.attendance || 0;
                  rekapMap[mapKey].sakit += s.sick || 0;
                  rekapMap[mapKey].alpha += s.tidakHadir || 0;
              });
          });

          renderRekapTable(rekapMap, className);

          if (!hasData) {
              ui.rekapTbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-greenest-600">Belum ada data absensi yang dikirim.</td></tr>';
          }

      } catch (e) {
          console.error("Error loading rekap:", e);
          ui.rekapTbody.innerHTML = `<tr class="bg-redest-100"><td colspan="6" class="text-center py-4 text-redest-700">Gagal mengambil rekap: ${e.message}</td></tr>`;
      }
    }


    // --- LOGIKA UI & HELPER ---

    function updateUIState(isLocked) {
      if (isLocked) {
        ui.statusMsg.classList.remove('hidden');
        ui.btnKirim.disabled = true; ui.btnKirim.classList.add('opacity-50', 'cursor-not-allowed');
      } else {
        ui.statusMsg.classList.add('hidden');
        ui.btnKirim.disabled = false; ui.btnKirim.classList.remove('opacity-50', 'cursor-not-allowed');
      }
      
      document.querySelectorAll('.btn-absen, .btn-sakit, .btn-hapus').forEach(btn => {
          if(isLocked) {
              btn.disabled = true;
              btn.classList.add('opacity-50', 'cursor-not-allowed');
          } else {
              btn.disabled = false;
              btn.classList.remove('opacity-50', 'cursor-not-allowed');
          }
      });

      if(ui.btnHapusSiswa) {
          if(isLocked) {
              ui.btnHapusSiswa.disabled = true;
              ui.btnHapusSiswa.classList.add('opacity-50', 'cursor-not-allowed');
          } else {
              ui.btnHapusSiswa.disabled = false;
              ui.btnHapusSiswa.classList.remove('opacity-50', 'cursor-not-allowed');
          }
      }
    }

    function renderTable() {
      ui.tbody.innerHTML = '';
      if (!studentsData || studentsData.length === 0) {
        ui.tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-greenest-600">Tidak ada siswa di kelas ini.</td></tr>';
        return;
      }
      
      studentsData.forEach((student, index) => {
        const status = student.statusToday; 
        const tr = document.createElement('tr');
        tr.classList.add('border-b', 'hover:bg-greenest-100');
        tr.innerHTML = `
          <td class="px-4 py-2 border border-greenest-300 align-middle">${index + 1}</td>
          <td class="px-4 py-2 border border-greenest-300 align-middle">${student.name}</td>
          <td class="px-4 py-2 border border-greenest-300 align-middle text-center">${student.statusToday === 'absen' ? '1' : '0'}</td>
          <td class="px-4 py-2 border border-greenest-300 align-middle text-center">${student.statusToday === 'sakit' ? '1' : '0'}</td>
          <td class="px-4 py-2 border border-greenest-300 align-middle text-center">${student.statusToday === null ? '1' : '0'}</td>
          <td class="px-4 py-2 border border-greenest-300 align-middle text-center flex justify-center gap-2">
            <button data-id="${student.id}" class="btn-absen px-3 py-1 rounded transition ${status === 'absen' ? 'bg-greenest-700 text-greenest-50 cursor-not-allowed' : 'bg-greenest-500 text-greenest-50 hover:bg-greenest-600'}" title="${status === 'absen' ? 'Sudah absen hari ini' : 'Hadir'}" ${status === 'absen' ? 'disabled' : ''}>
              <i class="fas fa-check"></i>
            </button>
            <button data-id="${student.id}" class="btn-sakit px-3 py-1 rounded transition ${status === 'sakit' ? 'bg-yellowest-700 text-yellowest-50 cursor-not-allowed' : 'bg-yellowest-600 text-yellowest-50 hover:bg-yellowest-700'}" title="${status === 'sakit' ? 'Sudah sakit hari ini' : 'Sakit'}" ${status === 'sakit' ? 'disabled' : ''}>
              <i class="fas fa-bed"></i>
            </button>
            <button data-id="${student.id}" class="btn-hapus px-3 py-1 rounded bg-redest-700 text-white hover:bg-redest-800 transition" title="Hapus Siswa">
              <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        `;
        ui.tbody.appendChild(tr);
      });
      attachTableEventListeners();
    }

    function renderRekapTable(mapData, filterClass = null) {
        ui.rekapTbody.innerHTML = '';
        let no = 1;
        
        let sortedData = Object.values(mapData);
        sortedData.sort((a, b) => {
            if (a.class < b.class) return -1;
            if (a.class > b.class) return 1;
            return a.name.localeCompare(b.name);
        });
        
        sortedData.forEach(s => {
            const tr = document.createElement('tr');
            tr.classList.add('border-b', 'hover:bg-greenest-100');
            tr.innerHTML = `
              <td class="border border-greenest-300 px-4 py-2">${no++}</td>
              <td class="border border-greenest-300 px-4 py-2">${s.name}</td>
              <td class="border border-greenest-300 px-4 py-2 text-center">${classCodeToRoman(s.class)}</td>
              <td class="border border-greenest-300 px-4 py-2 text-center">${s.hadir}</td>
              <td class="border border-greenest-300 px-4 py-2 text-center">${s.sakit}</td>
              <td class="border border-greenest-300 px-4 py-2 text-center">${s.alpha}</td>
            `;
            ui.rekapTbody.appendChild(tr);
        });

        if(no === 1) ui.rekapTbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-greenest-600">Tidak ada data rekap untuk filter ini.</td></tr>';
    }

    function attachTableEventListeners() {
      document.querySelectorAll('.btn-absen').forEach((btn) => {
        btn.onclick = () => { markStatus(btn.getAttribute('data-id'), 'absen'); };
      });
      document.querySelectorAll('.btn-sakit').forEach((btn) => {
        btn.onclick = () => { markStatus(btn.getAttribute('data-id'), 'sakit'); };
      });
      document.querySelectorAll('.btn-hapus').forEach((btn) => {
        btn.onclick = () => { 
          if (ui.btnKirim.disabled) { alert('Absensi hari ini sudah selesai dan tidak bisa diubah.'); return; }
          const id = btn.getAttribute('data-id');
          const studentIndex = studentsData.findIndex(s => s.id === id);
          if (studentIndex !== -1) {
            const confirmDelete = confirm(`Apakah Anda yakin ingin menghapus siswa "${studentsData[studentIndex].name}" dari kelas ${classCodeToRoman(currentClass)}?`);
            if (confirmDelete) {
              studentsData.splice(studentIndex, 1);
              sessionStorage.setItem(`master_students_${currentClass}`, JSON.stringify(studentsData.map(s => ({id: s.id, name: s.name}))));
              renderTable();
              alert('Siswa berhasil dihapus secara lokal. Jangan lupa Kirim Absensi untuk konfirmasi.');
            }
          }
        };
      });
    }

    function markStatus(id, type) {
        const student = studentsData.find(s => s.id === id);
        if(!student) return;
        
        if (ui.btnKirim.disabled) {
            alert('Absensi hari ini sudah selesai dan tidak bisa diubah.');
            return;
        }

        if (student.statusToday === type) {
            student.statusToday = null;
        } else {
            student.statusToday = type;
        }
        renderTable();
    }
    
    function showSection(name) {
      ui.classSection.classList.add('hidden');
      ui.rekapSection.classList.add('hidden');
      ui.tambahSection.classList.add('hidden');
      ui.hapusSection.classList.add('hidden');
      
      if(name === 'class') ui.classSection.classList.remove('hidden');
      if(name === 'rekap') ui.rekapSection.classList.remove('hidden');
      if(name === 'tambah') ui.tambahSection.classList.remove('hidden');
      if(name === 'hapus') ui.hapusSection.classList.remove('hidden');
    }
    
    function populateHapusSiswaSelect() {
      ui.hapusSiswaSelect.innerHTML = '';
      if (!currentClass || studentsData.length === 0) {
          const option = document.createElement('option');
          option.textContent = 'Tidak ada siswa di kelas ini';
          option.disabled = true;
          ui.hapusSiswaSelect.appendChild(option);
          document.getElementById('btn-confirm-hapus').disabled = true;
          return;
      }
      studentsData.forEach(student => {
          const option = document.createElement('option');
          option.value = student.id;
          option.textContent = student.name;
          ui.hapusSiswaSelect.appendChild(option);
      });
      document.getElementById('btn-confirm-hapus').disabled = false;
    }


    // --- MAIN EVENT LISTENERS ---
    
    // FIX: Attach event listener to class buttons (Memicu loadClassData)
    ui.classButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        loadClassData(btn.getAttribute('data-class'));
      });
    });
    
    // FIX: Attach event listeners to all main buttons
    document.getElementById('btn-kirim').addEventListener('click', saveAttendanceToDB);
    
    document.getElementById('btn-tambah').addEventListener('click', () => {
        showSection('tambah');
        ui.kelasSiswaSelect.value = currentClass || '';
        ui.namaSiswaInput.value = '';
    });
    
    document.getElementById('btn-hapus-siswa').addEventListener('click', () => {
        if (!currentClass) { alert('Pilih kelas terlebih dahulu.'); return; }
        showSection('hapus');
        populateHapusSiswaSelect();
    });

    document.getElementById('form-tambah').addEventListener('submit', (e) => {
      e.preventDefault();
      const nama = ui.namaSiswaInput.value.trim();
      const kelas = ui.kelasSiswaSelect.value;
      if (!nama || !kelas) { alert('Mohon isi nama dan pilih kelas siswa.'); return; }
      
      const newStudent = {
          id: crypto.randomUUID(),
          name: nama,
          attendance: 0, sick: 0, statusToday: null,
      };
      
      if (kelas === currentClass) {
          studentsData.push(newStudent);
          sessionStorage.setItem(`master_students_${currentClass}`, JSON.stringify(studentsData.map(s => ({id: s.id, name: s.name}))));
          renderTable();
          alert(`Siswa "${nama}" berhasil ditambahkan ke kelas ${classCodeToRoman(kelas)}. Jangan lupa Kirim Absensi untuk konfirmasi.`);
          showSection('class');
      } else {
          let masterList = JSON.parse(sessionStorage.getItem(`master_students_${kelas}`)) || generateDummyStudents(kelas);
          masterList.push(newStudent);
          sessionStorage.setItem(`master_students_${kelas}`, JSON.stringify(masterList.map(s => ({id: s.id, name: s.name}))));
          alert(`Siswa "${nama}" berhasil ditambahkan ke kelas ${classCodeToRoman(kelas)}.`);
          showSection('class');
      }
    });

    ui.btnCancelTambah.addEventListener('click', () => { showSection('class'); });
    ui.btnCancelHapus.addEventListener('click', () => { showSection('class'); });
    
    ui.btnConfirmHapus.addEventListener('click', () => {
      const selectedId = ui.hapusSiswaSelect.value;
      if (!selectedId) { alert('Pilih siswa yang akan dihapus.'); return; }
      const studentIndex = studentsData.findIndex(s => s.id === selectedId);
      
      if (studentIndex !== -1) {
          const confirmDelete = confirm(`Apakah Anda yakin ingin menghapus siswa "${studentsData[studentIndex].name}" dari kelas ${classCodeToRoman(currentClass)}?`);
          if (confirmDelete) {
              studentsData.splice(studentIndex, 1);
              sessionStorage.setItem(`master_students_${currentClass}`, JSON.stringify(studentsData.map(s => ({id: s.id, name: s.name}))));
              alert('Siswa berhasil dihapus secara lokal.');
              showSection('class');
              renderTable();
          }
      }
    });


    ui.btnRekap.addEventListener('click', () => {
      if (!currentClass) { alert('Pilih kelas terlebih dahulu.'); return; }
      const { year, month } = getCurrentYearMonth();
      ui.rekapYearSelect.value = year;
      ui.rekapMonthSelect.value = month;
      showSection('rekap');
      loadRekapFromDB(currentClass, year, month); 
    });
    
    ui.btnGlobalRekap.addEventListener('click', () => {
      const { year } = getCurrentYearMonth();
      ui.rekapYearSelect.value = year;
      ui.rekapMonthSelect.value = '';
      showSection('rekap');
      loadRekapFromDB(null, year, null); 
    });
    
    ui.btnRekapRefresh.addEventListener('click', () => {
        const year = ui.rekapYearSelect.value;
        const month = ui.rekapMonthSelect.value;
        loadRekapFromDB(currentClass, year, month);
    });
    ui.rekapYearSelect.addEventListener('change', () => {
        const year = ui.rekapYearSelect.value;
        const month = ui.rekapMonthSelect.value;
        loadRekapFromDB(currentClass, year, month);
    });
    ui.rekapMonthSelect.addEventListener('change', () => {
        const year = ui.rekapYearSelect.value;
        const month = ui.rekapMonthSelect.value;
        loadRekapFromDB(currentClass, year, month);
    });

    ui.btnBack.addEventListener('click', () => {
        if(currentClass) {
            loadClassData(currentClass); 
        } else {
            ui.classSection.classList.add('hidden');
            ui.rekapSection.classList.add('hidden');
        }
    });
    
    ui.btnPrint.addEventListener('click', () => {
      window.print();
    });

    console.log("Sistem Absensi Dzuhur Terhubung ke Firebase Project: " + firebaseConfig.projectId);
  </script>
</body>
</html>
